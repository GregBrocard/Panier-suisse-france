name: Sonde des sites

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Mot recherché"
        default: "nutella"
      extra:
        description: "URL supplémentaires (tag=url;tag2=url2)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sonder
        env:
          SCRAPER_DEBUG: "1"
          PROBE_QUERY: ${{ inputs.query }}
          PROBE_EXTRA: ${{ inputs.extra }}
        run: python -m scraper.probe
      - uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 7
