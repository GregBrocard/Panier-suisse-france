name: Sonde des sites

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Commande à lancer"
        default: "python -m scraper.probe"
      query:
        description: "Mot recherché (sonde)"
        default: "nutella"
      extra:
        description: "URL supplémentaires (tag=url;tag2=url2)"
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sonder
        env:
          SCRAPER_DEBUG: "1"
          PROBE_QUERY: ${{ inputs.query }}
          PROBE_EXTRA: ${{ inputs.extra }}
        run: |
          mkdir -p debug
          ( ${{ inputs.cmd }} ) 2>&1 | tee debug/_summary.txt
      # Les pages téléchargées sont publiées sur la branche "sonde" (écrasée à chaque fois)
      - name: Publier les pages sur la branche sonde
        if: always()
        run: |
          cd debug
          git init -q -b sonde
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add -A && git commit -qm "Sonde $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonde
