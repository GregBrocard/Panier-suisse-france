name: Relevé mensuel des prix

on:
  schedule:
    # le 20 de chaque mois à 06:17 UTC (après publication des séries OFAG et INSEE du mois précédent)
    - cron: "17 6 20 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Construire les données
        run: python -m scraper.build
      - name: Construire le site
        run: python -m scraper.site
      - name: Enregistrer le relevé
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add data/ site/index.html site/public.html
          git diff --cached --quiet || git commit -m "Relevé $(date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Préparer la publication
        run: |
          mkdir -p _site
          cp site/public.html _site/index.html
          cp data/latest.json data/series.json METHODOLOGIE.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
