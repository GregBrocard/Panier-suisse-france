name: Relevé mensuel des prix

on:
  schedule:
    # le 20 de chaque mois à 06:17 UTC (après publication des séries OFAG et INSEE du mois précédent)
    - cron: "17 6 20 * *"
  workflow_dispatch:
    inputs:
      site_seulement:
        description: "Republier le site sans refaire le relevé (true/false)"
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Tests des calculs
        run: python -m pytest -q tests
      - name: Construire les données
        if: ${{ inputs.site_seulement != 'true' }}
        run: python -m scraper.build
      - name: Essence du jour
        if: ${{ inputs.site_seulement != 'true' }}
        run: python -m scraper.essence || true
      - name: Construire le site
        run: python -m scraper.site --out _site
      - name: Enregistrer le relevé
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Relevé $(date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Signaler les alertes (ticket GitHub)
        if: ${{ inputs.site_seulement != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          r = json.load(open("data/controles.json"))
          if r.get("alertes"):
              body = "Le robot a relevé des points à vérifier lors du relevé du " + r["date"] + " :\n\n" + \
                     "\n".join("- " + a for a in r["alertes"]) + "\n\nValeurs reprises du mois précédent :\n\n" + \
                     ("\n".join("- " + a for a in r["reprises"]) or "- aucune") + \
                     "\n\nLe site est publié ; les valeurs douteuses sont signalées. Détail : data/controles.json."
              subprocess.run(["gh", "issue", "create", "--title", "Relevé du " + r["date"] + " : à vérifier", "--body", body], check=False)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site publié
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20
          ok=1
          for p in "" "essence/" "methodologie/" "data/latest.json"; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' "${URL}${p}")
            if [ "$code" != "200" ] || [ ! -s /tmp/page ]; then echo "Échec : ${URL}${p} ($code)"; ok=0; fi
          done
          grep -q "Panier Suisse France" <(curl -s "$URL") || { echo "Accueil sans titre"; ok=0; }
          if [ "$ok" = 0 ]; then
            t="Site publié inaccessible ou incomplet"
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$t in:title" --json number -q length)
            [ "$n" = "0" ] && gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "La vérification après publication a échoué : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
