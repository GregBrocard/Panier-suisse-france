name: Tests

on:
  push:
    paths: ["scraper/**", "site/**", "tests/**", "config/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Le site se construit
        run: python -m scraper.site --out _site
