name: Essence du jour

on:
  schedule:
    - cron: "41 5 * * *"   # chaque jour à 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  essence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Relever les prix des stations
        run: python -m scraper.essence
      - name: Construire le site
        run: python -m scraper.site --out _site
      - name: Enregistrer
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add data/essence.json data/barometre/ data/stations_osm.json 2>/dev/null; git add data/essence.json data/barometre/
          git diff --cached --quiet || git commit -m "Essence $(date +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: essence
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site publié
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20
          ok=1
          for p in "" "essence/" "methodologie/" "data/latest.json"; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' "${URL}${p}")
            if [ "$code" != "200" ] || [ ! -s /tmp/page ]; then echo "Échec : ${URL}${p} ($code)"; ok=0; fi
          done
          grep -q "Panier Suisse France" <(curl -s "$URL") || { echo "Accueil sans titre"; ok=0; }
          if [ "$ok" = 0 ]; then
            t="Site publié inaccessible ou incomplet"
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$t in:title" --json number -q length)
            [ "$n" = "0" ] && gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "La vérification après publication a échoué : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
