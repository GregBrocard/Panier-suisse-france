# Panier de référence Suisse / France
# ------------------------------------
# Chaque ligne décrit un BESOIN (ex. "1 L de lait UHT demi-écrémé"), pas un produit d'un pays.
# Le robot cherche, dans chaque enseigne, les produits qui remplissent ce besoin,
# ramène tout au prix unitaire (CHF ou EUR par kg / L / pièce), puis multiplie par ref_qty.
#
# type: generic -> panier "premier prix" : le produit valide le moins cher de l'enseigne
# type: brand   -> panier "marques" : le même produit de marque des deux côtés (comparaison pure)
#
# match.include : tous ces mots doivent apparaître dans le nom (insensible à la casse/accents)
# match.any     : au moins un de ces mots
# match.exclude : aucun de ces mots
# size          : bornes acceptées pour le conditionnement, dans l'unité de l'article
#
# Version du panier : quand on modifie ce fichier, on incrémente basket_version
# pour que le site sache que l'historique n'est plus strictement comparable.

basket_version: 1

items:
  # ---------- Produits laitiers & œufs ----------
  - id: lait
    label: Lait UHT demi-écrémé
    category: Laitier
    type: generic
    unit: L
    ref_qty: 2
    query: lait UHT demi-écrémé
    match: { include: [lait], any: [demi, drink, "1.5%", "1,5%"], exclude: [chocolat, avoine, soja, amande, lactose, bio, entier, crème, creme, café, cafe] }
    size: { min: 0.5, max: 1.5 }

  - id: beurre
    label: Beurre (doux / de table)
    category: Laitier
    type: generic
    unit: kg
    ref_qty: 0.25
    query: beurre
    match: { include: [beurre], exclude: [cacahuète, cacahuete, karité, margarine, demi-sel, salé, ail, herbes, biscuit, bio, allégé] }
    size: { min: 0.1, max: 0.5 }

  - id: oeufs
    label: Œufs (10 pièces)
    category: Laitier
    type: generic
    unit: pce
    ref_qty: 10
    query: œufs frais
    match: { any: [oeufs, œufs, oeuf, œuf], exclude: [chocolat, pâques, paques, cuits, durs, caille, bio, pâtes, pates, nouilles] }
    size: { min: 6, max: 15 }

  - id: yaourt
