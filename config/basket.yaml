    query: yaourt nature
    match: { any: [yaourt, yogourt, yoghourt, yogurt], include: [nature], exclude: [grec, soja, avoine, bio, sucré, boire] }
    size: { min: 0.1, max: 1.0 }

  - id: mozzarella
