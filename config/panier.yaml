# Panier de référence Suisse / France — version 2 (octobre 2026 : crèmerie, nouvelles marques)
# ===============================================
# Trois couches, chacune avec ses sources :
#
#  1. "officiel"  : séries statistiques officielles mensuelles
#                   Suisse = OFAG (Office fédéral de l'agriculture), relevés commerce de détail
#                   France = INSEE, prix moyens mensuels de vente au détail en métropole
#                   -> historique long (2006+ pour les fruits & légumes)
#  2. "viande"    : France = INSEE ; Suisse = relevé automatique Migros (médiane des produits valides),
#                   réduit de `viande_ajustement_discount` pour refléter les prix des discounters
#  3. "marques"   : produits identiques ; Suisse = Migros ; France = Open Prices (médiane nationale 6 mois)
#
# qty : quantité de référence d'un panier hebdomadaire pour un ménage de deux personnes.
# Toute modification de ce fichier incrémente basket_version.

basket_version: 2

officiel:
  # ---------------- Fruits ----------------
  - { id: bananes,     label: Bananes,            cat: Fruits,  unit: kg, qty: 1.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Bananes"] },
      insee: ["000641432"] }
  - { id: pommes,      label: Pommes,             cat: Fruits,  unit: kg, qty: 1.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Pommes Golden I", "Pommes Gala I", "Pommes Braeburn I"] },
      insee: ["000641367"] }
  - { id: poires,      label: Poires,             cat: Fruits,  unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Poires Conférence I", "Poires Williams I"] },
      insee: ["000641369"] }
  - { id: clementines, label: Clémentines,        cat: Fruits,  unit: kg, qty: 1.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Clémentines"] },
      insee: ["000641435"] }
  - { id: oranges,     label: Oranges,            cat: Fruits,  unit: kg, qty: 1.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Oranges blondes"] },
      insee: ["000641365"] }
  # ---------------- Légumes ----------------
  - { id: tomates,     label: Tomates,            cat: Légumes, unit: kg, qty: 1.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Tomates grappes", "Tomates charnues"] },
      insee: ["000641429"] }
  - { id: carottes,    label: Carottes,           cat: Légumes, unit: kg, qty: 1.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Carottes"] },
      insee: ["000641422"] }
  - { id: courgettes,  label: Courgettes,         cat: Légumes, unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Courgettes"] },
      insee: ["000641425"] }
  - { id: champignons, label: Champignons de Paris, cat: Légumes, unit: kg, qty: 0.25,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Champignons de Paris"] },
      insee: ["000641423"] }
  - { id: oignons,     label: Oignons jaunes,     cat: Légumes, unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Oignons jaunes"] },
      insee: ["000641427"] }
  - { id: poireaux,    label: Poireaux,           cat: Légumes, unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Poireau vert"] },
      insee: ["000641428"] }
  - { id: endives,     label: Endives,            cat: Légumes, unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Chicorée Witloof"] },
      insee: ["000641426"] }
  - { id: poivrons,    label: Poivrons,           cat: Légumes, unit: kg, qty: 0.5,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Poivrons"] },
      insee: ["010596274"] }
  - { id: pdt,         label: Pommes de terre,    cat: Légumes, unit: kg, qty: 2.0,
      ofag: { cube: FruitsVegetablesPotatoes, products: ["Chair ferme : vert", "Chair farineuse : bleu"] },
      insee: ["000641360"] }
  # ---------------- Pain ----------------
  # Pain : types différents (mi-blanc en Suisse, baguette en France) -> affiché à part, hors total
  - { id: pain,        label: "Pain courant (CH mi-blanc, FR baguette)", cat: Pain, unit: kg, qty: 1.0, in_total: false,
      ofag: { cube: BreadCerealsFlourBakedGoods, products: ["Pain mi-blanc , non bio, moyenne"] },
      insee: ["000442423"], fill_months: 3 }

  # ---------------- Crèmerie et huile (groupe « cremerie », v2) ----------------
  # France : l'INSEE a arrêté ses prix moyens de ces produits en décembre 2019. Prix estimé chaque mois =
  # prix moyen INSEE de décembre 2019 × évolution de l'indice des prix harmonisé du même poste (INSEE, base 2025).
  - { id: lait,     label: "Lait UHT (CH drink 2,7 %, FR demi-écrémé)", cat: Crèmerie, groupe: cremerie, unit: L, qty: 3.0,
      ofag: { cube: MilkDairyProducts, products: ["Lait drink UHT"] },
      fr_indexe: { insee_arrete: "000442480", base_mois: "2019-12", indice: "011812298", facteur: 1 } }
  - { id: beurre,   label: Beurre,             cat: Crèmerie, groupe: cremerie, unit: kg, qty: 0.25,
      ofag: { cube: MilkDairyProducts, products: ["Beurre de choix"] },
      fr_indexe: { insee_arrete: "000442490", base_mois: "2019-12", indice: "011812325", facteur: 4 } }
  - { id: emmental, label: "Emmental (CH doux, FR français)", cat: Crèmerie, groupe: cremerie, unit: kg, qty: 0.3,
      ofag: { cube: MilkDairyProducts, products: ["Emmentaler doux"] },
      fr_indexe: { insee_arrete: "000442487", base_mois: "2019-12", indice: "011812307", facteur: 1 } }
  - { id: yaourt,   label: Yaourt nature,      cat: Crèmerie, groupe: cremerie, unit: kg, qty: 1.0,
      ofag: { cube: MilkDairyProducts, products: ["Yogourt nature"] },
      fr_indexe: { insee_arrete: "000849398", base_mois: "2019-12", indice: "011812310", facteur: 2 } }
  - { id: huile,    label: Huile de tournesol, cat: Crèmerie, groupe: cremerie, unit: L, qty: 0.5, fill_months: 4,
      ofag: { cube: Oilseeds, products: ["Huile de tournesol, non bio, import"] },
      fr_indexe: { insee_arrete: "000442493", base_mois: "2019-12", indice: "011812322", facteur: 1 } }

# Prix suisse de la viande ramené au niveau des discounters (Aldi, Lidl) :
# Migros environ 5 % plus cher qu'Aldi et Lidl sur un panier de 100 produits (K-Tipp, août 2025).
viande_ajustement_discount: 0.05
viande_ajustement_source: "K-Tipp, test de prix de 100 produits courants, août 2025"

viande:
  - { id: entrecote, label: Entrecôte de bœuf,  unit: kg, qty: 0.3, insee: ["000442435"],
      migros: { query: entrecôte de bœuf, include: [entrecôte], exclude: [bio, marinée, cuite, sauce, burger, haché] } }
  - { id: veau,      label: Escalope de veau,   unit: kg, qty: 0.2, insee: ["000442441"],
      migros: { query: escalope de veau, include: [veau], any: [escalope, escalopes], exclude: [bio, panée, pané, cordon, viennoise, sauce] } }
  - { id: porc,      label: Rôti de porc,       unit: kg, qty: 0.4, insee: ["000442448"],
      migros: { query: rôti de porc, include: [porc], any: [rôti, roti], exclude: [bio, cuit, fumé, sauce] } }
  - { id: jambon,    label: Jambon cuit supérieur, unit: kg, qty: 0.2, insee: ["000849397"],
      migros: { query: jambon cuit, include: [jambon], exclude: [cru, parme, serrano, poulet, dinde, bio, croissant, sandwich, pizza, fumé] } }

marques:
  # Produits de marque identiques des deux côtés, comparés au prix unitaire (par kg ou par litre).
  # France : Open Prices, médiane nationale des relevés hors promotion sur 6 mois s'il y a au moins 10 relevés,
  #          sinon sur 12 mois (code-barres ean_fr,
  #          conditionnement size_fr). Suisse : Migros, produit de la même marque et gamme.
  - { id: nutella,  label: "Nutella",                   unit: kg, qty: 0.75, ean_fr: ["3017620421006"], size_fr: 0.75,
      migros: { query: nutella, include: [nutella], exclude: [biscuits, b-ready, plant, go], size: [0.35, 1.0] } }
  - { id: coca,     label: "Coca-Cola (bouteille PET)", unit: L,  qty: 1.5,  ean_fr: ["5449000267412"], size_fr: 1.25,
      migros: { query: coca-cola, include: [coca], exclude: [zero, light, cherry, vanille, sans sucre, verre], size: [1.0, 2.0] } }
  - { id: redbull,  label: "Red Bull 25 cl",            unit: L,  qty: 0.25, ean_fr: ["9002490205973"], size_fr: 0.25,
      migros: { query: red bull, include: [red bull], exclude: [sugarfree, sans sucre, zero, edition, light], size: [0.25, 0.25] } }
  - { id: pringles, label: "Pringles Original",         unit: kg, qty: 0.175, ean_fr: ["5053990156009"], size_fr: 0.175,
      migros: { query: pringles original, include: [pringles, original], exclude: [], size: [0.15, 0.2] } }
  - { id: kinder,   label: "Kinder Bueno",              unit: kg, qty: 0.129, ean_fr: ["8000500025857"], size_fr: 0.129,
      migros: { query: kinder bueno, include: [kinder, bueno], exclude: [white, mini, ice, glace, eis], size: [0.04, 0.5] } }
  - { id: lindt,    label: "Lindt Excellence noir 100 g", unit: kg, qty: 0.1, ean_fr: ["3046920010047"], size_fr: 0.1,
      migros: { query: lindt excellence, include: [lindt, excellence], exclude: [lait, milk, orange, menthe, poire, sel, caramel, blanc], size: [0.1, 0.1] } }

  - { id: oreo,     label: "Oreo Original",             unit: kg, qty: 0.154, ean_fr: ["7622300336738"], size_fr: 0.154,
      migros: { query: oreo original, include: [oreo, original], exclude: [mini, cream, cône, cones, ice, golden, double], size: [0.15, 0.16] } }
  - { id: babybel,  label: "Mini Babybel (12 × 22 g)",  unit: kg, qty: 0.264, ean_fr: ["3073781178005"], size_fr: 0.264,
      migros: { query: mini babybel, include: [babybel], exclude: [allégé, light, protéines, rouleaux], size: [0.25, 0.28] } }
  - { id: evian,    label: "Evian (6 × 1,5 L)",         unit: L,  qty: 3.0,  ean_fr: ["3068320120263"], size_fr: 9.0,
      migros: { query: evian, include: [evian], exclude: [mini, sport, sparkling, gazeuse, 500ml, 330ml, 750ml], size: [8.5, 9.5] } }
  - { id: pesto,    label: "Barilla Pesto alla Genovese", unit: kg, qty: 0.19, ean_fr: ["8076809513753"], size_fr: 0.19,
      migros: { query: barilla pesto genovese, include: [barilla, pesto], any: [genovese], exclude: [rosso, vegan, bio], size: [0.18, 0.2] } }

carburant:
  # France : prix officiels station par station (data.economie.gouv.fr), par zone frontalière
  # Suisse : prix en zone frontière genevoise publié par l'OFDF (tableau T 4.4, mensuel)
  # Historique France : INSEE prix moyens mensuels
  types:
    - { id: sp95,   label: Sans plomb 95, insee: ["000849411"] }
    - { id: diesel, label: Diesel,        insee: ["000442588"] }
  # Stations françaises : autour de chaque destination (config/destinations.yaml)

# Prix par magasin : comparateur des supermarchés de l'UFC-Que Choisir (panier d'une centaine de produits).
# Pour chaque zone : magasins « graines » + tous les magasins à moins de 15 km d'eux (liste publiée par Que Choisir).
# Référence : médiane d'un panel national de magasins tirés au hasard (tirage fixe).
# publier: true = données Que Choisir affichées sur le site public (accord de l'UFC-Que Choisir non encore demandé).
quechoisir:
  publier: true
  panel: { n: 600, seed: 2026 }   # tirage brut ; les identifiants valides sont gardés dans data/qc_panel.json
  # Magasins : tous ceux des départements listés dans config/destinations.yaml, rattachés à la ville la plus proche
