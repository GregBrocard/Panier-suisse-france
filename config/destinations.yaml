# Villes françaises où les Suisses vont faire leurs courses.
# Chaque magasin Que Choisir des départements listés est rattaché à la destination la plus proche,
# s'il se trouve à moins de `rayon_km` de son centre. Les stations-service sont prises dans le même rayon.
# Pour ajouter une ville : une ligne de plus ici, le robot fait le reste au passage suivant.
# `points` (facultatif) : pour une zone qui regroupe plusieurs communes voisines, un magasin est rattaché
# s'il est à moins de `rayon_km` de l'un de ces points. lat/lon reste le point d'arrivée du trajet.

