# Enseignes relevées
# ------------------
# Côté suisse, les grandes chaînes appliquent des prix nationaux : un seul relevé par chaîne,
# valable pour les trois zones.
# Côté français, les prix des drives varient d'un magasin à l'autre : un relevé par magasin,
# rattaché à sa zone frontalière.
#
# scraper : module dans scraper/ qui sait lire le site de l'enseigne
# store   : paramètres propres au magasin (identifiant drive, etc.), complétés au premier test

zones:
  - id: annemasse
    label: Genève ↔ Annemasse
    border: Moillesulaz / Thônex-Vallard
  - id: divonne
    label: Nyon ↔ Divonne / La Cure
    border: Divonne-les-Bains / La Cure
  - id: vallorbe
    label: Vallorbe ↔ Jougne / Pontarlier
    border: Vallorbe / Jougne

stores:
  # ---------- Suisse (prix nationaux) ----------
  - id: ch_migros
    country: CH
    chain: Migros
    tier: standard
    scraper: migros
    zones: [annemasse, divonne, vallorbe]

  - id: ch_lidl
    country: CH
    chain: Lidl
    tier: discount
    scraper: lidl_ch
    zones: [annemasse, divonne, vallorbe]

  # ---------- France ----------
  - id: fr_lidl
    country: FR
    chain: Lidl
    tier: discount
    scraper: lidl_fr
    zones: [annemasse, divonne, vallorbe]

# Enseignes écartées : leurs sites bloquent les robots (protection DataDome ou Akamai).
# Le projet ne contourne pas ces protections. Voir METHODOLOGIE.md, section Sources.
#   Coop, Aldi Suisse, E.Leclerc Drive, Carrefour, Intermarché, Super U
