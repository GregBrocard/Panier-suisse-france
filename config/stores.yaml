# Enseignes relevées
# ------------------
# Côté suisse, les grandes chaînes appliquent des prix nationaux : un seul relevé par chaîne,
# valable pour les trois zones.
# Côté français, les prix des drives varient d'un magasin à l'autre : un relevé par magasin,
# rattaché à sa zone frontalière.
#
# scraper : module dans scraper/ qui sait lire le site de l'enseigne
# store   : paramètres propres au magasin (identifiant drive, etc.), complétés au premier test

zones:
  - id: annemasse
    label: Genève ↔ Annemasse
    border: Moillesulaz / Thônex-Vallard
  - id: divonne
    label: Nyon ↔ Divonne / La Cure
    border: Divonne-les-Bains / La Cure
  - id: vallorbe
    label: Vallorbe ↔ Jougne / Pontarlier
    border: Vallorbe / Jougne

stores:
  # ---------- Suisse (prix nationaux) ----------
  - id: ch_coop
    country: CH
    chain: Coop
    tier: standard
    scraper: coop
    zones: [annemasse, divonne, vallorbe]

  - id: ch_migros
    country: CH
    chain: Migros
    tier: standard
    scraper: migros
    zones: [annemasse, divonne, vallorbe]

  - id: ch_lidl
    country: CH
    chain: Lidl
    tier: discount
    scraper: lidl_ch
    zones: [annemasse, divonne, vallorbe]

  - id: ch_aldi
    country: CH
    chain: Aldi
    tier: discount
    scraper: aldi_ch
    zones: [annemasse, divonne, vallorbe]

  # ---------- France (prix par magasin) ----------
  - id: fr_leclerc_annemasse
    country: FR
    chain: E.Leclerc
    tier: standard
    scraper: leclerc_drive
    zones: [annemasse]
    store: { city: Ville-la-Grand, postcode: "74100", search: annemasse }

  - id: fr_leclerc_divonne
    country: FR
    chain: E.Leclerc
    tier: standard
    scraper: leclerc_drive
    zones: [divonne]
    store: { city: Gex, postcode: "01170", search: gex }

  - id: fr_leclerc_vallorbe
    country: FR
    chain: E.Leclerc
    tier: standard
    scraper: leclerc_drive
    zones: [vallorbe]
    store: { city: Pontarlier, postcode: "25300", search: pontarlier }
